name: Unzip uploaded project

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip every zip at repo root over the repo
        run: |
          shopt -s nullglob
          for f in *.zip; do
            echo "Extracting $f"
            unzip -o "$f" -d .
            rm -f "$f"
          done

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract uploaded project zip"
          git push
