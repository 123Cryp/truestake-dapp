name: Unzip uploaded project

on:
  push:
    paths:
      - "upload.zip"

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip upload.zip over the repo
        run: |
          unzip -o upload.zip -d .
          rm -f upload.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Auto-extract uploaded project zip"
          git push
